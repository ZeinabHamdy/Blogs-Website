{% extends 'base.html' %}

{% block content %}

    <div class='content-section container'>
        
        <form method='POST'>
            {% csrf_token %}
            <fieldset class='field-group'>
                <legend class='border-bottom mb-4'> Create a new account </legend>

                {% include '_form_fields.html' with form=form %}

            </fieldset>
            <div class='form-group mt-4'>
                <button type='submit' class='my-btn'> Sign up </button>
            </div>

            <div class='border-top pt-3 '>
                <small class='text-muted' > 
                    Already have an account ? 
                    <a href='login' class='ml-2' > Login to your account </a>
                </small>
            </div>
            
        </form>
    </div>

{% endblock content %}
