{% extends 'base.html' %}
{% load static %}

{% block title %}
    {{title}}
{% endblock %}

{% block content %}
    <h2>Register</h2><br>
    <p>Please fill in the form below to create a new account.</p><br>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    <br><br>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>

{% endblock %}
