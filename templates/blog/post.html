{% extends "base.html" %}
{% load static %}
{% block title %}
    Our Blogs
{% endblock %}
{% block content %}
    <h1>Our Blogs</h1>
    {% for post in posts %}
        <article>
            <p class="title">{{ post.title }}</p>
            <p class="author">By {{ post.author }}</p>
            <p class="content">{{ post.content }}</p>
        </article>
        <hr>
    {% endfor %}
{% endblock %}
