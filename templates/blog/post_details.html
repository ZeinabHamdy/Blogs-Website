{% extends "base.html" %}
{% load static %}
{% block title %}
    {{ posts.title }}    
{% endblock %}
{% block content %}
    <article>
        <p class='title'>{{ posts.title }}</p> 
        <p class='smaller'>
            <span class='date'>Published on {{ posts.published_at }}</span>
            <span class='author'>By {{ posts.author }}</span>
        </p>
        <p class='content'>{{ posts.content }}</p>
    </article>
{% endblock %}
