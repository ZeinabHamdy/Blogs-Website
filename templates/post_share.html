{% extends 'base.html' %}

{% block content %}
<div class="share-container">
    <h2>Share "{{ post.title }}" via Email</h2>

    {% if sent %}
        <p class="success-message">✅ Your email has been sent successfully!</p>
    {% else %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>
            <button type="submit" class="share-btn"> Send Email</button>
        </form>
    {% endif %}

    <a href="{% url 'post_details' pk=post.pk %}" class="back-btn">⬅ Back to Post</a>
</div>
{% endblock content %}
